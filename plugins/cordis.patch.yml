# gnts.dev — the whole composition in one place.
#
# Every disable and every mount our product makes, in the order it happens.
# Each package still ships its own cordis.patch.yml so installing it mounts itself;
# this file is the consolidated view, for reading and for restoring a profile.
#
# Every row names an entry id, never a version — so this file survives an upstream
# bump on its own. The vendored copies are the other half and are the part that
# has to be re-applied.

# ── disabled: upstream entries our packages replace or exclude ──────────────

- id: ui-settings-models
  disabled: true


# One option in the Official group, off by default.
- id: dsh-market
  disabled: true






- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: ui-brand-official
  disabled: true

- id: ui-sidebar-right
  disabled: true

- id: ui-plugin-manager
  disabled: true

- id: ui-settings-general
  disabled: true

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

# The "Help improve DeepSeek models and products" toggle only applies to the official API,
# which this build does not use. Nothing to upload, so the row is not offered.
- id: ui-settings-session-log
  disabled: true


# ── mounted: our packages ───────────────────────────────────────────────────

- insert:
    - id: gnts-autodiscover
      name: gnts-autodiscover
    - id: gnts-brand
      name: gnts-brand
    - id: gnts-folders
