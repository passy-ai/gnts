    - id: gnts-model-search
      name: gnts-model-search
    - id: gnts-pairing
      name: gnts-pairing
    - id: gnts-plugins
      name: gnts-plugins
    - id: gnts-settings
      name: gnts-settings
    - id: gnts-sidebar
      name: gnts-sidebar
    - id: gnts-sidebar-shell
      name: gnts-sidebar-shell
    - id: gnts-glass
      name: gnts-glass
    - id: dsh-model-default
      name: dsh-model-default
    - id: gnts-tunnel
      name: gnts-tunnel
    - id: model-catalog
      name: model-catalog
