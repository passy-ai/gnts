# Your patch layer for this dsh profile, applied after every bundle layer.
#
# This is the consolidated composition: every upstream entry we replace is disabled
# here, and every package we add is mounted here. Each package also ships its own
# cordis.patch.yml so installing it mounts itself; this file is the whole picture.
#
# Deliberately absent: any Passy provider. The wallet plugin registers that itself at
# runtime, with the models the gateway serves for THIS wallet — so a fresh install has
# no Passy provider at all, and none appears until someone chooses a wallet.
#
# Also absent: any agent-default-model row. Naming a provider that nothing has
# registered yet is fatal, not a preference — the chat entry fails to activate and the
# composer disappears. The wallet plugin writes the default once the route exists.

# ── disabled: upstream entries our packages replace or exclude ──────────────

- id: ui-settings-models
  disabled: true

# Offered in the Plugins page as an official extra, off until chosen.
- id: gnts-passy-wallet
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: ui-brand-official
  disabled: true

- id: ui-sidebar-right
  disabled: true

- id: ui-plugin-manager
  disabled: true

- id: ui-settings-general
  disabled: true

- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

# The "Help improve DeepSeek models and products" toggle only applies to the official API,
# which this build does not use. Nothing to upload, so the row is not offered.
- id: ui-settings-session-log
  disabled: true

# ── mounted: our packages ───────────────────────────────────────────────────

# NOT here: any llm-pi-ai block, and any `- id: dsh-market` row. Both were pinned here at
# some point, and a pinned entry cannot be edited from the UI — it answers "configuration is
# overridden by a home patch" to every write. Pinning llm-pi-ai's providers key was worse:
# it claimed the whole key, so Autodiscover could never save a provider, and the empty
# "gnts" provider it left behind pointed at the gateway and could not be removed.
#
# The vendor bundles mount themselves with their own defaults. Autodiscover owns the
# llm-pi-ai providers from here on.

- insert:
    - id: gnts-autodiscover
      name: gnts-autodiscover
    - id: gnts-brand
      name: gnts-brand
    - id: gnts-folders
      name: gnts-folders
    - id: gnts-model-search
      name: gnts-model-search
    - id: gnts-pairing
      name: gnts-pairing
    - id: gnts-plugins
      name: gnts-plugins
    - id: gnts-settings
      name: gnts-settings
    - id: gnts-sidebar
      name: gnts-sidebar
    - id: gnts-sidebar-shell
      name: gnts-sidebar-shell
    - id: gnts-glass
      name: gnts-glass
    - id: dsh-model-default
      name: dsh-model-default
    - id: gnts-tunnel
      name: gnts-tunnel
